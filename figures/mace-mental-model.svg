<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Stage 1: atoms as a graph -->
  <g>
    <rect x="20" y="70" width="210" height="160" rx="10" fill="#eef2f7" stroke="#33465c" stroke-width="1.5"/>
    <text x="125" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2433">Atoms as a graph</text>
    <circle cx="80" cy="120" r="10" fill="#33465c"/>
    <circle cx="150" cy="105" r="10" fill="#33465c"/>
    <circle cx="180" cy="165" r="10" fill="#33465c"/>
    <circle cx="95" cy="190" r="10" fill="#33465c"/>
    <circle cx="150" cy="200" r="10" fill="#33465c"/>
    <line x1="80" y1="120" x2="150" y2="105" stroke="#7c8ba1" stroke-width="2"/>
    <line x1="80" y1="120" x2="95" y2="190" stroke="#7c8ba1" stroke-width="2"/>
    <line x1="150" y1="105" x2="180" y2="165" stroke="#7c8ba1" stroke-width="2"/>
    <line x1="95" y1="190" x2="150" y2="200" stroke="#7c8ba1" stroke-width="2"/>
    <line x1="150" y1="200" x2="180" y2="165" stroke="#7c8ba1" stroke-width="2"/>
    <text x="125" y="250" text-anchor="middle" font-size="12.5" fill="#333333">nodes = atoms</text>
    <text x="125" y="267" text-anchor="middle" font-size="12.5" fill="#333333">edges = nearby neighbors</text>
  </g>

  <line x1="235" y1="150" x2="285" y2="150" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: message passing -->
  <g>
    <rect x="290" y="70" width="210" height="160" rx="10" fill="#eef2f7" stroke="#33465c" stroke-width="1.5"/>
    <text x="395" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2433">Message passing</text>
    <text x="395" y="105" text-anchor="middle" font-size="12.5" fill="#333333">several rounds, each atom</text>
    <text x="395" y="122" text-anchor="middle" font-size="12.5" fill="#333333">updates from its neighbors</text>
    <text x="395" y="160" text-anchor="middle" font-size="12.5" font-style="italic" fill="#333333">equivariant</text>
    <text x="395" y="178" text-anchor="middle" font-size="11.5" fill="#555555">(rotate atoms, forces rotate too)</text>
    <text x="395" y="205" text-anchor="middle" font-size="12.5" font-style="italic" fill="#333333">higher-order</text>
    <text x="395" y="223" text-anchor="middle" font-size="11.5" fill="#555555">(many-body, not just pairwise)</text>
  </g>

  <line x1="505" y1="150" x2="555" y2="150" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: output -->
  <g>
    <rect x="560" y="70" width="180" height="160" rx="10" fill="#eef2f7" stroke="#33465c" stroke-width="1.5"/>
    <text x="650" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2433">Read out</text>
    <text x="650" y="135" text-anchor="middle" font-size="14" fill="#333333">Total energy</text>
    <text x="650" y="160" text-anchor="middle" font-size="20" fill="#1a2433">+</text>
    <text x="650" y="185" text-anchor="middle" font-size="14" fill="#333333">Force on</text>
    <text x="650" y="203" text-anchor="middle" font-size="14" fill="#333333">every atom</text>
  </g>
</svg>
